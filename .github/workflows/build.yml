name: Build

# Runs the unit tests and builds the universal app, signed ad hoc, on every push
# to main and every pull request. Catches test failures and compile errors with
# the runner's Xcode before a release tag is pushed. Needs no secrets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # The Swift tests (Tests/SpaceJumperCoreTests) and the tests of the
      # scripts in bin/ (Tests/Scripts), as `make test` runs them locally.
      - name: Run the tests
        run: make test

      - name: Build universal app
        run: make app ARCHS=universal

      - name: Check the bundle
        run: |
          APP=build/SpaceJumper.app
          test -x "$APP/Contents/MacOS/SpaceJumper"
          test -x "$APP/Contents/Library/LoginItems/SpaceJumperLoginHelper.app/Contents/MacOS/SpaceJumperLoginHelper"
          test -x "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
          lipo -archs "$APP/Contents/MacOS/SpaceJumper" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/SpaceJumper" | grep -q x86_64
